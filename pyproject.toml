[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "propevolve"
version = "0.1.0"
description = "A reasoning trading policy trained from frozen FFM embeddings and prop-challenge RL."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "optuna>=4.8,<5",
  "pandas>=2.1",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mlx = ["mlx>=0.32,<0.33"]
reasoning = ["mlx>=0.32,<0.33", "mlx-lm>=0.25.2"]
ffm = [
  "futures-foundation-model[foundation] @ git+https://github.com/johnamcruz/Futures-Foundation-Model.git@fbb96c3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/propevolve"]

[tool.hatch.build.targets.wheel.force-include]
"config/reasoning/defaults.json" = "propevolve/reasoning_policy/defaults.json"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
