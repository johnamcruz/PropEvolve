[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "propevolve"
version = "0.1.0"
description = "A self-improving recurrent RL trading agent driven by frozen FFM embeddings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "ml-training-loop @ git+https://github.com/johnamcruz/ML-training-loop.git@9150279a179598484ff284b116ef990e6c206a37",
  "numpy>=1.26",
  "optuna>=4.8,<5",
  "pandas>=2.1",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mlx = ["mlx>=0.32,<0.33"]
ffm = [
  "futures-foundation-model[foundation] @ git+https://github.com/johnamcruz/Futures-Foundation-Model.git@fbb96c3",
]

[project.scripts]
propevolve = "propevolve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/propevolve"]

[tool.hatch.build.targets.wheel.force-include]
"config/defaults.json" = "propevolve/defaults.json"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
